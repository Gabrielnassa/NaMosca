<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabela do jogo do bicho — Na Mosca</title>
  <meta name="description" content="Os 25 grupos do jogo do bicho com suas dezenas e cotações de referência.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='18' fill='%230e5a3a'/><circle cx='20' cy='20' r='11' fill='none' stroke='white' stroke-width='2.5'/><circle cx='20' cy='20' r='4.5' fill='%23e8a400'/></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <h1>Tabela do jogo do bicho</h1>
    <p>Os 25 grupos e suas 4 dezenas. Para descobrir o bicho de uma milhar, olhe os dois últimos dígitos.</p>
  </div>
  <div class="toolbar">
    <label class="field"><span>Qual o bicho do número?</span><input type="search" id="num" placeholder="ex.: 4532" inputmode="numeric" maxlength="4"></label>
    <div id="num-res" style="padding-bottom:8px"></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))" id="bichos"></div>
  <section class="section">
    <h2>Modalidades e cotações de referência</h2>
    <p class="muted">Quanto cada modalidade paga por R$ 1,00 apostado. Valores variam entre bancas.</p>
    <div class="card table-wrap" id="modalidades"></div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/stats.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/artigos.js"></script>
<script src="assets/js/pages/tabela.js"></script>
</body>
</html>
