name: Atualizar resultados

on:
  schedule:
    # a cada 15 min, das 08h às 22h45 (horário de Brasília = UTC-3)
    - cron: '*/15 11-23 * * *'
    - cron: '*/15 0-1 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Quantos concursos anteriores das loterias buscar'
        default: '60'
      dias_bicho:
        description: 'Quantos dias anteriores do bicho importar (0 = só hoje)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: resultados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Coletar resultados
        run: node scripts/atualizar-resultados.mjs --backfill=${{ github.event.inputs.backfill || '60' }} --dias-bicho=${{ github.event.inputs.dias_bicho || '2' }}
      - name: Publicar dados
        if: always()
        run: |
          git config user.name "na-mosca-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sem novidades."; exit 0; fi
          git commit -m "Resultados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
