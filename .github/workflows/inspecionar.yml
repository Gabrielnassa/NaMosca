name: Inspecionar fonte
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs separadas por espaço'
        default: 'https://portalbrasil.net/jogodobicho/rio-de-janeiro/ https://deunoposte.app.br/ https://portalbrasil.net/jogodobicho/sao-paulo/'
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/inspecionar.mjs ${{ github.event.inputs.urls }}
