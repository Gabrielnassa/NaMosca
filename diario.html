<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diário e limites — Na Mosca</title>
  <meta name="description" content="Registre o que você joga e ganha, defina limites de gasto e acompanhe o saldo real mês a mês.">
  <link rel="icon" type="image/png" href="assets/img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0f1c">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="canonical" href="https://gabrielnassa.github.io/NaMosca/diario.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Na Mosca">
  <meta property="og:title" content="Diário e limites — Na Mosca">
  <meta property="og:description" content="Registre o que você joga e ganha, defina limites de gasto e acompanhe o saldo real mês a mês.">
  <meta property="og:image" content="https://gabrielnassa.github.io/NaMosca/assets/img/icon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
  <section class="hero"><div class="wrap hero-row"><div><span class="eyebrow">Controle</span><h1>Diário e limites</h1>
    <p>Anote o que joga e o que ganha. O saldo real, mês a mês, é a melhor análise que existe. Tudo fica guardado só neste navegador.</p></div>
    <div class="btn-row" style="margin:0"><button class="btn btn-soft" id="exportar">Backup (.json)</button><label class="btn btn-soft" style="position:relative">Restaurar<input type="file" id="importar" accept="application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label></div></div></section>
  <div class="wrap panel-float">
    <div id="alerta"></div>
    <div class="kpis" id="kpis"></div>
    <section class="section">
      <div class="grid g-side">
        <div class="stack">
          <div class="card stack"><header><h3>Nova anotação</h3></header>
            <div class="grid g2"><label class="field"><span>Data</span><input type="date" id="d-data"></label><label class="field"><span>Sorteio / jogo</span><input type="text" id="d-sort" list="sorteios-list" placeholder="PT, SP17, Quininha…"></label></div>
            <datalist id="sorteios-list"></datalist>
            <label class="field"><span>Modalidade</span><select id="d-mod"></select></label>
            <div class="grid g2"><label class="field"><span>Valor apostado (R$)</span><input type="number" id="d-valor" min="0" step="0.5"></label><label class="field"><span>Prêmio recebido (R$)</span><input type="number" id="d-premio" min="0" step="0.5" value="0"></label></div>
            <label class="field"><span>Observação</span><input type="text" id="d-obs" maxlength="80" placeholder="opcional"></label>
            <button class="btn btn-primary" id="d-add">Anotar</button></div>
          <div class="card stack"><header><h3>Meus limites</h3></header>
            <div class="grid g2"><label class="field"><span>Por dia (R$)</span><input type="number" id="l-dia" min="0" step="1" placeholder="sem limite"></label><label class="field"><span>Por mês (R$)</span><input type="number" id="l-mes" min="0" step="10" placeholder="sem limite"></label></div>
            <p class="note" style="margin:0">Ao chegar perto do limite, um aviso aparece em todas as páginas do site.</p></div>
        </div>
        <div class="stack">
          <div class="card"><header><h3>Saldo por mês</h3></header><div id="meses"></div></div>
          <div class="card"><header><h3>Anotações</h3><span class="muted small" id="n-anot"></span></header><div class="table-wrap scroll-y" id="lista"></div></div>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/stats.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/diario.js"></script>
</body>
</html>
