<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultados do jogo do bicho — Na Mosca</title>
  <meta name="description" content="Resultados de todas as extrações por banca e data.">
  <link rel="icon" type="image/png" href="assets/img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0f1c">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="canonical" href="https://gabrielnassa.github.io/NaMosca/resultados.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Na Mosca">
  <meta property="og:title" content="Resultados do jogo do bicho — Na Mosca">
  <meta property="og:description" content="Resultados de todas as extrações por banca e data.">
  <meta property="og:image" content="https://gabrielnassa.github.io/NaMosca/assets/img/icon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
  <section class="hero">
    <div class="wrap hero-row">
      <div><span class="eyebrow">Resultados</span><h1>Sorteios</h1><p id="dia-txt"></p></div>
      <div class="pills" id="pills">
        <button data-f="hoje" class="on">Hoje</button>
        <button data-f="ontem">Ontem</button>
        <label id="cal-lbl">Calendário<input type="date" id="data" aria-label="Escolher data"></label>
      </div>
    </div>
  </section>
  <div class="wrap panel-float">
    <div class="card"><div class="grade" id="grade"></div><div id="legenda"></div></div>

    <section class="section">
      <div class="grid g-main">
        <div id="detalhe"></div>
        <div class="card"><header><h3 id="hist-title">Últimos resultados</h3></header><div class="table-wrap" id="hist"></div></div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="section-title"><h2>Todos os resultados do dia</h2>
        <label class="field" style="flex-direction:row;align-items:center;gap:8px"><span>Buscar milhar/dezena</span><input type="search" id="busca" placeholder="4532 ou leão" maxlength="20" style="width:130px"></label></div>
      <div id="busca-res"></div>
      <div class="grid g2" id="lista"></div>
    </section>
  </div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/stats.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/resultados.js"></script>
</body>
</html>
