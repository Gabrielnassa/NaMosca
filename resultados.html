<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultados do jogo do bicho — Na Mosca</title>
  <meta name="description" content="Resultados de todas as extrações por banca e data.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='18' fill='%230e5a3a'/><circle cx='20' cy='20' r='11' fill='none' stroke='white' stroke-width='2.5'/><circle cx='20' cy='20' r='4.5' fill='%23e8a400'/></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="wrap">
  <div class="page-head"><div><span class="eyebrow">Resultados</span><h1>Resultados do jogo do bicho</h1>
    <p>Do 1º ao 5º prêmio de cada extração, com o 6º e o 7º logo abaixo.</p></div></div>
  <div class="stack" style="margin-bottom:16px">
    <div id="banca-bar"></div>
    <div class="pills" id="pills">
      <button data-f="hoje" class="on">Hoje</button>
      <button data-f="ontem">Ontem</button>
      <button data-f="7">Últimos 7 dias</button>
      <label id="cal-lbl">Calendário<input type="date" id="data" aria-label="Escolher data"></label>
    </div>
    <label class="field" style="max-width:320px"><span>Buscar milhar ou dezena nos últimos 180 dias</span><input type="search" id="busca" placeholder="ex.: 32 ou 4532" inputmode="numeric" maxlength="4"></label>
  </div>
  <div id="busca-res"></div>
  <div class="stack" id="lista"></div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/stats.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/resultados.js"></script>
</body>
</html>
