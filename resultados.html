<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultados do jogo do bicho — Na Mosca</title>
  <meta name="description" content="Resultados de todas as extrações por banca e data.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='18' fill='%230e5a3a'/><circle cx='20' cy='20' r='11' fill='none' stroke='white' stroke-width='2.5'/><circle cx='20' cy='20' r='4.5' fill='%23e8a400'/></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <h1>Resultados</h1>
    <p>Resultados do 1º ao 7º prêmio de cada extração. O 1º prêmio é a <b>cabeça</b>; o 6º é a soma dos cinco primeiros e o 7º a centena do produto do 1º pelo 2º.</p>
  </div>
  <div class="toolbar">
    <div id="banca-bar"></div>
    <label class="field"><span>Data</span><input type="date" id="data"></label>
    <div class="btn-row" style="margin:0">
      <button class="btn btn-soft" id="prev">← Dia anterior</button>
      <button class="btn btn-soft" id="next">Próximo dia →</button>
    </div>
    <label class="field" style="margin-left:auto"><span>Buscar milhar/dezena</span><input type="search" id="busca" placeholder="ex.: 32 ou 4532" inputmode="numeric" maxlength="4"></label>
  </div>
  <div id="busca-res"></div>
  <div class="grid auto" id="lista"></div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/stats.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/resultados.js"></script>
</body>
</html>
