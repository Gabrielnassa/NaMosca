<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de palpites — Na Mosca</title>
  <meta name="description" content="Gere palpites de grupo, dezena, centena, milhar, duque e terno com estratégias estatísticas.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='18' fill='%230e5a3a'/><circle cx='20' cy='20' r='11' fill='none' stroke='white' stroke-width='2.5'/><circle cx='20' cy='20' r='4.5' fill='%23e8a400'/></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="wrap">
  <div class="page-head"><div><span class="eyebrow">Gerador</span>
    <h1>Gerador de palpites</h1>
    <p>Escolha a modalidade e a estratégia. Toque em um bicho para <b>fixar</b> (verde), toque de novo para <b>excluir</b> (riscado) e mais uma vez para liberar.</p></div></div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)" id="ger-grid">
    <div class="card">
      <div class="toolbar" style="flex-direction:column;align-items:stretch">
        <div id="banca-bar"></div>
        <label class="field"><span>Modalidade</span><select id="modalidade">
          <option value="grupo">Grupo</option><option value="duque-gp">Duque de grupo</option><option value="terno-gp">Terno de grupo</option>
          <option value="dezena">Dezena</option><option value="centena">Centena</option><option value="milhar">Milhar</option>
          <option value="duque-dz">Duque de dezena</option><option value="terno-dz">Terno de dezena</option></select></label>
        <label class="field"><span>Estratégia</span><select id="estrategia">
          <option value="equilibrado">Equilibrada (frequência + atraso)</option>
          <option value="quentes">Bichos quentes (mais frequentes)</option>
          <option value="frios">Bichos frios (mais atrasados)</option>
          <option value="vencidos">Vencidos (atraso acima da média)</option>
          <option value="puxada">Puxada (bicho puxa bicho)</option>
          <option value="aleatorio">Aleatória pura</option></select></label>
        <label class="field"><span>Quantidade de jogos</span><input type="number" id="qtd" min="1" max="50" value="10"></label>
        <p class="muted small" id="estrategia-desc" style="margin:0"></p>
      </div>
      <h3>Bichos</h3>
      <div class="picker" id="picker"></div>
      <div class="btn-row"><button class="btn btn-primary" id="gerar">Gerar palpites</button><button class="btn btn-soft" id="limpar">Limpar seleção</button></div>
    </div>
    <div class="card">
      <header><h3>Seus palpites</h3><div class="btn-row" style="margin:0"><button class="btn btn-soft" id="copiar">Copiar</button><a class="btn btn-soft" id="conferir" href="conferidor.html">Conferir</a></div></header>
      <div id="jogos"><p class="empty">Clique em “Gerar palpites”.</p></div>
      <div id="resumo" style="margin-top:14px"></div>
    </div>
  </div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/stats.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/artigos.js"></script>
<script src="assets/js/pages/gerador.js"></script>
</body>
</html>
